<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Lite Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
#error{display:none;position:absolute;inset:0;color:#fff;background:#000;font:14px Arial;padding:30px;box-sizing:border-box}
</style>
</head>
<body>
<div id="error">No video ID was supplied.</div>
<iframe id="yt"
  title="YouTube player"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const id=p.get("v");
  const autoplay=p.get("autoplay")==="1"?"1":"0";

  if(!/^[A-Za-z0-9_-]{11}$/.test(id||"")){
    document.getElementById("error").style.display="block";
    return;
  }

  // This page is served over HTTPS. YouTube receives this page's normal
  // HTTPS origin/referrer instead of a chrome-extension:// origin.
  const origin=encodeURIComponent(location.origin);
  const src="https://www.youtube.com/embed/"+encodeURIComponent(id)+
    "?autoplay="+autoplay+
    "&rel=0"+
    "&origin="+origin;

  document.getElementById("yt").src=src;
})();
</script>
</body>
</html>
